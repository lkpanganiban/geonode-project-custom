name: Tests

on:
  push:
    branches:
      - master
      - 5.0.x
  pull_request:
    branches:
      - master
      - 5.0.x

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev \
            build-essential python3-dev libxml2-dev libxslt1-dev \
            libjpeg-dev zlib1g-dev libpng-dev libfreetype6-dev \
            liblcms2-dev libopenjp2-7-dev libtiff-dev libwebp-dev \
            tcl8.6-dev tk8.6-dev python3-tk libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r src/requirements.txt
          pip install -e src/

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: geonode_project.test_settings
          SECRET_KEY: dummy-secret-key-for-tests
          SITEURL: http://localhost:8000/
        run: |
          cd src
          python manage.py test geonode_project.tests --verbosity=2
